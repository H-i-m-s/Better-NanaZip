<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" role="img" aria-labelledby="title desc">
  <title id="title">NanaZip — 面向现代 Windows 的开源压缩工具</title>
  <desc id="desc">NanaZip，基于 7-Zip 的现代开源压缩工具，原生深色模式、Mica 材质与资源管理器右键菜单集成。</desc>

  <!-- Left: identity -->
  <text x="48" y="52" font-family="Segoe UI, Microsoft YaHei, system-ui, sans-serif" font-size="15" letter-spacing="3" fill="#58A6FF">面向现代 WINDOWS 的开源压缩工具</text>
  <text x="46" y="132" font-family="Segoe UI, system-ui, sans-serif" font-size="76" font-weight="700" fill="#E6EDF3">NanaZip</text>
  <text x="48" y="178" font-family="Segoe UI, Microsoft YaHei, system-ui, sans-serif" font-size="19" fill="#8B949E">基于 7-Zip 26.02 内核，为现代 Windows 体验重建。</text>
  <text x="48" y="204" font-family="Segoe UI, Microsoft YaHei, system-ui, sans-serif" font-size="19" fill="#8B949E">开源、可审计、MIT 许可。</text>

  <!-- Feature chips -->
  <g font-family="Segoe UI, Microsoft YaHei, system-ui, sans-serif" font-size="13" fill="#E6EDF3">
    <rect x="48" y="232" width="128" height="30" rx="15" fill="#161B22" stroke="#30363D"/>
    <text x="112" y="251" text-anchor="middle" fill="#58A6FF">深色模式</text>
    <rect x="190" y="232" width="148" height="30" rx="15" fill="#161B22" stroke="#30363D"/>
    <text x="264" y="251" text-anchor="middle" fill="#58A6FF">Mica 材质</text>
    <rect x="352" y="232" width="196" height="30" rx="15" fill="#161B22" stroke="#30363D"/>
    <text x="450" y="251" text-anchor="middle" fill="#58A6FF">资源管理器菜单</text>
  </g>

  <!-- Motif: archive layer stack -->
  <g fill="#1F2937" stroke="#30363D">
    <rect x="48" y="284" width="34" height="34" rx="6" stroke-width="1.5"/>
    <rect x="60" y="296" width="34" height="34" rx="6" fill="#161B22" stroke="#58A6FF" stroke-width="1.5"/>
  </g>
  <text x="104" y="309" font-family="Consolas, Menlo, monospace" font-size="12" fill="#8B949E">7-Zip 26.02 core · MIT license</text>

  <!-- Right: main-window skeleton -->
  <g transform="translate(640 46)">
    <rect x="0" y="0" width="512" height="268" rx="8" fill="#0D1117" stroke="#30363D" stroke-width="1.5"/>
    <!-- title bar -->
    <circle cx="16" cy="18" r="4" fill="#30363D"/>
    <circle cx="32" cy="18" r="4" fill="#30363D"/>
    <circle cx="48" cy="18" r="4" fill="#30363D"/>
    <rect x="72" y="10" width="200" height="16" rx="8" fill="#161B22" stroke="#30363D"/>
    <text x="82" y="22" font-family="Segoe UI, Microsoft YaHei, system-ui, sans-serif" font-size="11" fill="#8B949E">NanaZip</text>
    <!-- address bar -->
    <rect x="12" y="40" width="488" height="30" rx="6" fill="#161B22" stroke="#30363D"/>
    <text x="24" y="59" font-family="Consolas, Menlo, monospace" font-size="12" fill="#8B949E">C:\Users\me\Documents\archives</text>
    <!-- toolbar buttons -->
    <rect x="12" y="80" width="52" height="22" rx="5" fill="#1F2937" stroke="#30363D"/>
    <text x="38" y="94" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, system-ui, sans-serif" font-size="11" fill="#E6EDF3">解压</text>
    <rect x="72" y="80" width="52" height="22" rx="5" fill="#1F2937" stroke="#30363D"/>
    <text x="98" y="94" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, system-ui, sans-serif" font-size="11" fill="#E6EDF3">添加</text>
    <!-- file list rows -->
    <g font-family="Segoe UI, Microsoft YaHei, system-ui, sans-serif" font-size="12">
      <rect x="12" y="112" width="488" height="24" fill="#12273D" stroke="#1F4D8C" stroke-width="1"/>
      <text x="24" y="128" fill="#E6EDF3">项目源码.zip</text>
      <text x="420" y="128" fill="#8B949E">2.4 MB</text>
      <text x="24" y="152" fill="#8B949E">照片-2026.tar</text>
      <text x="420" y="152" fill="#8B949E">1.1 GB</text>
      <text x="24" y="176" fill="#8B949E">笔记.7z</text>
      <text x="420" y="176" fill="#8B949E">86 KB</text>
      <text x="24" y="200" fill="#8B949E">固件.pkg</text>
      <text x="420" y="200" fill="#8B949E">12.7 MB</text>
      <text x="24" y="224" fill="#8B949E">档案.rar</text>
      <text x="420" y="224" fill="#8B949E">3.9 MB</text>
    </g>
    <!-- status bar -->
    <text x="24" y="252" font-family="Segoe UI, Microsoft YaHei, system-ui, sans-serif" font-size="10" fill="#8B949E">5 个项目 · NanaZip 6.5 · x64</text>
    <text x="440" y="252" font-family="Segoe UI, Microsoft YaHei, system-ui, sans-serif" font-size="10" fill="#3FB950">就绪</text>
  </g>
</svg>
