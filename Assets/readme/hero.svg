<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" role="img" aria-labelledby="title desc">
  <title id="title">NanaZip — modern open-source file archiver for Windows</title>
  <desc id="desc">NanaZip, an open-source file archiver forked from 7-Zip, rebuilt with dark mode, Mica material and File Explorer context menu integration.</desc>

  <!-- Left: identity -->
  <text x="48" y="52" font-family="Consolas, Menlo, monospace" font-size="13" letter-spacing="2.5" fill="#58A6FF">OPEN-SOURCE FILE ARCHIVER FOR MODERN WINDOWS</text>
  <text x="46" y="132" font-family="Segoe UI, system-ui, sans-serif" font-size="72" font-weight="700" fill="#E6EDF3">NanaZip</text>
  <text x="48" y="176" font-family="Segoe UI, system-ui, sans-serif" font-size="19" fill="#8B949E">The 7-Zip 26.02 core, rebuilt for the modern</text>
  <text x="48" y="202" font-family="Segoe UI, system-ui, sans-serif" font-size="19" fill="#8B949E">Windows experience. Open, auditable, permissive.</text>

  <!-- Feature chips -->
  <g font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#E6EDF3">
    <rect x="48" y="230" width="150" height="30" rx="15" fill="#161B22" stroke="#30363D"/>
    <text x="123" y="249" text-anchor="middle" fill="#58A6FF">Dark mode</text>
    <rect x="212" y="230" width="150" height="30" rx="15" fill="#161B22" stroke="#30363D"/>
    <text x="287" y="249" text-anchor="middle" fill="#58A6FF">Mica material</text>
    <rect x="376" y="230" width="176" height="30" rx="15" fill="#161B22" stroke="#30363D"/>
    <text x="464" y="249" text-anchor="middle" fill="#58A6FF">Explorer menu</text>
  </g>

  <!-- Motif: archive layer stack -->
  <g fill="#1F2937" stroke="#30363D">
    <rect x="48" y="282" width="34" height="34" rx="6" stroke-width="1.5"/>
    <rect x="60" y="294" width="34" height="34" rx="6" fill="#161B22" stroke="#58A6FF" stroke-width="1.5"/>
  </g>
  <text x="104" y="307" font-family="Consolas, Menlo, monospace" font-size="12" fill="#8B949E">7-Zip 26.02 core · MIT license</text>

  <!-- Right: main-window skeleton -->
  <g transform="translate(640 46)">
    <rect x="0" y="0" width="512" height="268" rx="8" fill="#0D1117" stroke="#30363D" stroke-width="1.5"/>
    <!-- title bar -->
    <circle cx="16" cy="18" r="4" fill="#30363D"/>
    <circle cx="32" cy="18" r="4" fill="#30363D"/>
    <circle cx="48" cy="18" r="4" fill="#30363D"/>
    <rect x="72" y="10" width="200" height="16" rx="8" fill="#161B22" stroke="#30363D"/>
    <text x="82" y="22" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#8B949E">NanaZip</text>
    <!-- address bar -->
    <rect x="12" y="40" width="488" height="30" rx="6" fill="#161B22" stroke="#30363D"/>
    <text x="24" y="59" font-family="Consolas, Menlo, monospace" font-size="12" fill="#8B949E">C:\Users\me\Documents\archives</text>
    <!-- toolbar buttons -->
    <rect x="12" y="80" width="52" height="22" rx="5" fill="#1F2937" stroke="#30363D"/>
    <text x="38" y="94" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#E6EDF3">Extract</text>
    <rect x="72" y="80" width="52" height="22" rx="5" fill="#1F2937" stroke="#30363D"/>
    <text x="98" y="94" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#E6EDF3">Add</text>
    <!-- file list rows -->
    <g font-family="Segoe UI, system-ui, sans-serif" font-size="12">
      <rect x="12" y="112" width="488" height="24" fill="#12273D" stroke="#1F4D8C" stroke-width="1"/>
      <text x="24" y="128" fill="#E6EDF3">project-src.zip</text>
      <text x="420" y="128" fill="#8B949E">2.4 MB</text>
      <text x="24" y="152" fill="#8B949E">photos-2026.tar</text>
      <text x="420" y="152" fill="#8B949E">1.1 GB</text>
      <text x="24" y="176" fill="#8B949E">notes.7z</text>
      <text x="420" y="176" fill="#8B949E">86 KB</text>
      <text x="24" y="200" fill="#8B949E">firmware.pkg</text>
      <text x="420" y="200" fill="#8B949E">12.7 MB</text>
      <text x="24" y="224" fill="#8B949E">archive.rar</text>
      <text x="420" y="224" fill="#8B949E">3.9 MB</text>
    </g>
    <!-- status bar -->
    <rect x="12" y="242" width="488" height="14" rx="3" fill="none"/>
    <text x="24" y="252" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#8B949E">5 items · NanaZip 6.5 · x64</text>
    <text x="440" y="252" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#3FB950">Ready</text>
  </g>
</svg>
